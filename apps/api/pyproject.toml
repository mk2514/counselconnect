[project]
name = "counselconnect-api"
version = "0.1.0"
description = "CounselConnect Judicial Case Management API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "redis>=5.1.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1.0",
    "celery[redis]>=5.4.0",
    "minio>=7.2.0",
    "pgvector>=0.3.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # FastAPI's Depends() pattern uses function calls in default args
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["redis.*", "celery.*", "minio.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.models.*"]
# SQLAlchemy relationship() uses string forward references that mypy
# cannot resolve without circular imports. This is a known pattern.
disable_error_code = ["name-defined"]
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["app.redis_client"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
