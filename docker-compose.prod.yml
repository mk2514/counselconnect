version: '3.8'

services:
  # -------------------------
  # TRAEFIK (Reverse Proxy / Custom Domain Support)
  # -------------------------
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # In a real environment, configure Let's Encrypt ACME here for HTTPS
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - counsel_network
    restart: unless-stopped

  # -------------------------
  # NEXT.JS FRONTEND
  # -------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_ORIGIN=${API_ORIGIN}
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - counsel_network
    restart: always

  # -------------------------
  # FASTAPI BACKEND
  # -------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - counsel_network
    restart: always
    # Execute uvicorn server
    command: >
      bash -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  # -------------------------
  # CELERY WORKER (Async Jobs)
  # -------------------------
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env.production
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres
      - ollama
    networks:
      - counsel_network
    restart: always

  # -------------------------
  # POSTGRESQL DATABASE
  # -------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - counsel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # -------------------------
  # REDIS (Session/Broker)
  # -------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - counsel_network
    restart: always

  # -------------------------
  # MINIO (Object Storage)
  # -------------------------
  storage:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - storage_data:/data
    networks:
      - counsel_network
    restart: always

  # -------------------------
  # OLLAMA (Local AI Model)
  # -------------------------
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - counsel_network
    restart: always

networks:
  counsel_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data:
  ollama_data:
